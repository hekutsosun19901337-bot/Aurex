<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Casino</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <div class="glow"></div>

    <header class="topbar">
      <div class="logo">N<span>O</span>IR</div>
      <div class="balance">💰 <span id="balance">1000</span></div>
    </header>

    <section class="hero">
      <div class="badge">CASINO</div>
      <h1>Добро пожаловать</h1>
      <p>Твоя игровая зона уже готова.</p>
      <button id="startBtn" class="primary">НАЧАТЬ</button>
    </section>

    <section class="games">
      <div class="section-title">Игры</div>
      <div class="game-card">
        <div class="game-icon">🚀</div>
        <div>
          <h2>Crash</h2>
          <p>Скоро доступно</p>
        </div>
        <span class="soon">SOON</span>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
